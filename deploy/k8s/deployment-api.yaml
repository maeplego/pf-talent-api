apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: talent-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: talent-api
  template:
    metadata:
      labels:
        app: talent-api
    spec:
      containers:
        - name: api
          image: pf-talent-api:latest
          ports:
            - containerPort: 8090
          env:
            - name: TALENT_HTTP_PORT
              value: "8090"
            - name: TALENT_DEV_AUTH
              value: "true"
            - name: TALENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: p10-secrets
                  key: TALENT_DATABASE_URL
            - name: CALENDAR_API_URL
              value: http://api.p05.svc.cluster.local:8095
            - name: CALENDAR_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: p10-secrets
                  key: CALENDAR_INTERNAL_TOKEN
          readinessProbe:
            httpGet:
              path: /ready
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10